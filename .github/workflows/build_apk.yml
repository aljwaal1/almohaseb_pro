name: Build Flutter APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Get dependencies
        run: flutter pub get

      - name: Build APK
        run: flutter build apk --debug || true

      - name: Search and copy APK
        run: |
          echo "Searching for APK files..."
          find . -name "*.apk" -type f
          mkdir -p output
          APK_FILE=$(find . -name "*.apk" -type f | head -n 1)
          if [ -z "$APK_FILE" ]; then
            echo "No APK file found"
            exit 1
          fi
          cp "$APK_FILE" output/almohaseb-pro.apk
          ls -la output

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: almohaseb-pro-apk
          path: output/almohaseb-pro.apk